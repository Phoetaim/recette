  build_androidApk:
    name: Build Flutter App (Android)
 #   needs: [flutter_test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v3
      - name: Setup Java to compile Android project
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install and set Flutter version
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Create the Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          ls
      - name: Create key.properties
        run: |
            cat > android/key.properties << EOF
            storePassword=${{ secrets.KEYSTORE_PASSWORD }}
            keyPassword=${{ secrets.KEYSTORE_PASSWORD_ALIAS }}
            keyAlias=${{ secrets.KEY_ALIAS }}
            storeFile=upload-keystore.jks
            EOF
      - name: Restore packages
        run: flutter pub get
      - name: Build Android App Bundle
        run: flutter build appbundle --release
      - name: Publish Android Artefacts
        uses: actions/upload-artifact@v4
        with:
          name: release-aab-signed
          path: build/app/outputs/bundle/release/app-release-signed.aab
